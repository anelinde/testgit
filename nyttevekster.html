<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nyttevekstleksikonet</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gd:#1a3a2a;--gm:#2d5a3d;--gs:#4a7c5e;--gp:#c8e6d4;--gmist:#f0f7f3;
  --am:#b8701f;--cream:#faf8f4;--ink:#1c1c1a;--mu:#6b7564;
  --bdr:rgba(45,90,61,.13);--shd:0 4px 24px rgba(26,58,42,.1);
}
body{font-family:"DM Sans",sans-serif;background:var(--cream);color:var(--ink)}
header{background:var(--gd);color:#fff;padding:2.5rem 2rem 2rem;text-align:center;position:relative;overflow:hidden}
header::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 20% 80%,rgba(74,124,94,.4) 0%,transparent 55%),radial-gradient(ellipse at 85% 15%,rgba(74,124,94,.2) 0%,transparent 50%);pointer-events:none}
header h1{font-family:"Playfair Display",serif;font-size:clamp(1.7rem,4vw,2.8rem);font-weight:700;position:relative}
header p{font-size:.88rem;color:var(--gp);margin-top:.5rem;font-weight:300;position:relative}
.hstats{display:flex;justify-content:center;gap:2rem;margin-top:1.25rem;position:relative}
.sn{display:block;font-size:1.5rem;font-weight:500;color:var(--gp)}
.sl{font-size:.68rem;color:rgba(200,230,212,.65);text-transform:uppercase;letter-spacing:.08em}
.ctrl{background:#fff;border-bottom:1px solid var(--bdr);padding:.85rem 1.5rem;position:sticky;top:0;z-index:50;display:flex;gap:.65rem;flex-wrap:wrap;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.sw{position:relative;flex:1;min-width:160px}
.sw svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none;width:15px;height:15px}
#search{width:100%;padding:.5rem .8rem .5rem 2rem;border:1px solid var(--bdr);border-radius:7px;font-family:inherit;font-size:.85rem;background:var(--gmist);color:var(--ink);outline:none}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.fb{padding:.35rem .8rem;border-radius:16px;border:1px solid var(--bdr);background:#fff;font-family:inherit;font-size:.75rem;cursor:pointer;color:var(--mu);transition:all .15s}
.fb:hover{background:var(--gmist);color:var(--gd)}
.fb.on{background:var(--gd);color:#fff;border-color:var(--gd)}
.fb.onm{background:var(--am);color:#fff;border-color:var(--am)}
#srt{padding:.35rem .65rem;border:1px solid var(--bdr);border-radius:7px;font-family:inherit;font-size:.75rem;background:#fff;color:var(--ink);cursor:pointer;outline:none}
.layout{display:grid;grid-template-columns:255px 1fr;min-height:calc(100vh - 180px)}
.sb{border-right:1px solid var(--bdr);background:#fff;overflow-y:auto;max-height:calc(100vh - 108px);position:sticky;top:60px}
.sbh{padding:.75rem 1rem .4rem;font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);border-bottom:1px solid var(--bdr);font-weight:500}
#plist{list-style:none}
.pi{display:flex;align-items:center;gap:8px;padding:.5rem 1rem;cursor:pointer;border-bottom:1px solid rgba(0,0,0,.03);transition:background .1s}
.pi:hover,.pi.on{background:var(--gmist)}
.pi.on{border-left:3px solid var(--gs);padding-left:calc(1rem - 3px)}
.pithumb{width:32px;height:32px;border-radius:5px;overflow:hidden;flex-shrink:0;border:1px solid var(--bdr);background:var(--gmist);display:flex;align-items:center;justify-content:center;position:relative}
.pin{font-size:.8rem;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pil{font-size:.66rem;color:var(--mu);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.ds{background:var(--gs)}.dm{background:var(--am)}
.main{padding:1.25rem}
.cattabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.1rem;padding-bottom:1rem;border-bottom:1px solid var(--bdr)}
.catbtn{display:flex;align-items:center;gap:5px;padding:.35rem .85rem;border-radius:16px;border:1px solid var(--bdr);background:#fff;font-family:inherit;font-size:.76rem;cursor:pointer;color:var(--mu);transition:all .15s;white-space:nowrap}
.catbtn:hover,.catbtn.on{background:var(--gd);color:#fff;border-color:var(--gd)}
.cbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.ctxt{font-size:.8rem;color:var(--mu)}
.vtog{display:flex;gap:3px}
.vb{padding:.3rem .55rem;border:1px solid var(--bdr);background:#fff;border-radius:6px;cursor:pointer;font-size:.8rem;color:var(--mu);transition:all .12s}
.vb.on{background:var(--gd);color:#fff;border-color:var(--gd)}
#det{display:none;background:#fff;border:1px solid var(--bdr);border-radius:13px;overflow:hidden;margin-bottom:1.25rem;animation:fu .22s ease}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.dettop{display:grid;grid-template-columns:280px 1fr}
.diw{height:250px;overflow:hidden;background:var(--gmist);position:relative;display:flex;align-items:center;justify-content:center;font-size:3.5rem;color:var(--gp)}
.diw img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.isrc{position:absolute;bottom:5px;left:5px;background:rgba(0,0,0,.52);color:#fff;font-size:.6rem;padding:2px 6px;border-radius:3px;z-index:2}
.dinfo{padding:1.25rem;display:flex;flex-direction:column}
.dbadge{display:inline-block;font-size:.68rem;padding:2px 8px;border-radius:9px;font-weight:500;margin-bottom:.5rem;width:fit-content}
.dname{font-family:"Playfair Display",serif;font-size:1.7rem;font-weight:700;line-height:1.1}
.dlatin{font-family:"Playfair Display",serif;font-style:italic;font-size:.9rem;color:var(--mu);margin:.2rem 0 .75rem}
.dcat{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;color:var(--gs);margin-bottom:.6rem;background:var(--gmist);padding:2px 8px;border-radius:8px;width:fit-content}
.ddesc{font-size:.87rem;color:var(--mu);line-height:1.65;flex:1}
.dact{display:flex;gap:6px;flex-wrap:wrap;margin-top:1rem}
.btn{padding:.42rem .9rem;border-radius:7px;font-family:inherit;font-size:.78rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:all .15s;border:none}
.bg{background:var(--gd);color:#fff}.bg:hover{background:var(--gm)}
.bm{background:var(--gs);color:#fff}.bm:hover{background:var(--gm)}
.bo{background:var(--gmist);color:var(--gd);border:1px solid var(--bdr)}.bo:hover{background:var(--gp)}
.detbot{border-top:1px solid var(--bdr);padding:1rem 1.25rem}
.detbot h3{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin-bottom:.6rem}
.rlist{display:flex;flex-wrap:wrap;gap:6px}
.rl{display:inline-flex;align-items:center;gap:5px;padding:.38rem .8rem;border:1px solid var(--bdr);border-radius:7px;font-size:.78rem;color:var(--gd);text-decoration:none;background:var(--gmist);transition:all .15s}
.rl:hover{background:var(--gp);border-color:var(--gs)}
.nor{font-size:.8rem;color:var(--mu)}.nor a{color:var(--gs)}
.sec-hdr{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:.4rem 0;margin-top:.4rem;border-bottom:1px solid var(--bdr);font-size:.8rem;font-weight:500;color:var(--gd);text-transform:uppercase;letter-spacing:.07em}
.sec-hdr .sc{font-size:.7rem;color:var(--mu);text-transform:none;letter-spacing:0;font-weight:400;margin-left:auto}
#pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:1rem}
.card{background:#fff;border:1px solid var(--bdr);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s;animation:fu .3s ease both}
.card:hover{transform:translateY(-3px);box-shadow:var(--shd)}
.cimg{width:100%;height:135px;background:var(--gmist);position:relative;display:flex;align-items:center;justify-content:center;font-size:2.5rem;color:var(--gp);overflow:hidden}
.cimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .3s}
.card:hover .cimg img{transform:scale(1.05)}
.cbadge{position:absolute;top:6px;right:6px;font-size:.62rem;padding:2px 6px;border-radius:8px;font-weight:500;z-index:2}
.bgs{background:rgba(26,58,42,.82);color:#fff}
.bgm{background:rgba(184,112,31,.88);color:#fff}
.isrc2{position:absolute;bottom:3px;left:3px;background:rgba(0,0,0,.5);color:#fff;font-size:.56rem;padding:1px 4px;border-radius:3px;z-index:2}
.cbody{padding:.7rem .8rem}
.cn{font-size:.87rem;font-weight:500;color:var(--ink)}
.cl{font-size:.71rem;color:var(--mu);font-style:italic;margin-top:1px}
.cc{font-size:.68rem;color:var(--gs);margin-top:3px}
#ptbl{display:none;width:100%;border-collapse:collapse}
#ptbl th{text-align:left;font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);padding:.55rem .85rem;border-bottom:1px solid var(--bdr);white-space:nowrap;cursor:pointer}
#ptbl th:hover{color:var(--gd)}
#ptbl td{padding:.55rem .85rem;font-size:.83rem;border-bottom:1px solid rgba(0,0,0,.04);vertical-align:middle}
#ptbl tr{cursor:pointer;transition:background .1s}
#ptbl tr:hover td{background:var(--gmist)}
.tt{width:36px;height:36px;border-radius:5px;border:1px solid var(--bdr);background:var(--gmist);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;font-size:1.1rem}
.tt img{position:absolute;inset:0;width:36px;height:36px;object-fit:cover}
.tbdg{font-size:.66rem;padding:2px 7px;border-radius:8px;font-weight:500;white-space:nowrap}
@media(max-width:860px){.layout{grid-template-columns:1fr}.sb{display:none}.dettop{grid-template-columns:1fr}.diw{height:190px}}
</style>
</head>
<body>
<header>
  <div style="font-size:1.6rem;margin-bottom:.35rem;position:relative">&#127807;</div>
  <h1>Nyttevekstleksikonet</h1>
  <p>Norges sopp- og nyttevekstforbund &middot; Ville, spiselige vekster i Norge</p>
  <div class="hstats">
    <div><span class="sn" id="sTot">0</span><span class="sl">Vekster</span></div>
    <div><span class="sn" id="sSp">0</span><span class="sl">Spiselige</span></div>
    <div><span class="sn" id="sMk">0</span><span class="sl">Med merknad</span></div>
  </div>
</header>

<div class="ctrl">
  <div class="sw">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search" placeholder="S&#248;k norsk eller latinsk navn&#8230;" oninput="render()">
  </div>
  <div class="filters" id="fbtns"></div>
  <select id="srt" onchange="render()">
    <option value="az">Navn A &#8594; &#197;</option>
    <option value="za">Navn &#197; &#8594; A</option>
    <option value="cat">Etter kategori</option>
    <option value="lat">Latin A &#8594; Z</option>
  </select>
</div>

<div class="layout">
  <aside class="sb">
    <div class="sbh" id="sbCnt">Laster&#8230;</div>
    <ul id="plist"></ul>
  </aside>
  <main class="main">
    <div id="det"></div>
    <div class="cattabs" id="cattabs"></div>
    <div class="cbar">
      <span class="ctxt" id="cntTxt"></span>
      <div class="vtog">
        <button class="vb on" id="vbg" onclick="setV('g')">&#9638; Kort</button>
        <button class="vb" id="vbt" onclick="setV('t')">&#9776; Liste</button>
      </div>
    </div>
    <div id="pgrid"></div>
    <table id="ptbl">
      <thead><tr>
        <th style="width:44px"></th>
        <th>Norsk navn</th>
        <th>Latinsk navn</th>
        <th>Kategori</th>
        <th>Spiselighet</th>
        <th>Mer info</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </main>
</div>

<script>

  {n:"Bl&#229;b&#230;r",la:"Vaccinium myrtillus",t:"s",cat:"baer",desc:"Norges mest plukket b&#230;r &ndash; rikt p&#229; antioksidanter. Til gr&#248;t, kaker, syltet&#248;y og saft.",nsnf:"https://soppognyttevekster.no/nyttevekst/blabaer/",rec:[{t:"Bl&#229;b&#230;rsyltet&#248;y",u:"https://www.matprat.no/oppskrifter/kos/blabarsyltetoy/"},{t:"Bl&#229;b&#230;rgr&#248;t",u:"https://www.matprat.no/oppskrifter/tradisjon/blabaergrot/"},{t:"T&#248;rket bl&#229;b&#230;r &ndash; viltgodt.no",u:"https://www.viltgodt.no/torka-blabaer/"}]},
  {n:"Tytteb&#230;r",la:"Vaccinium vitis-idaea",t:"s",cat:"baer",desc:"Norges klassiske b&#230;r. Syrlig og aromatisk. Tytteb&#230;rsyltet&#248;y er uunv&#230;rlig til viltkj&#248;tt.",nsnf:"https://soppognyttevekster.no/nyttevekst/tyttebaer/",rec:[{t:"R&#248;rte tytteb&#230;r",u:"https://www.matprat.no/oppskrifter/tradisjon/rorte-tyttebar/"},{t:"Tytteb&#230;rr&#248;mme",u:"https://www.matprat.no/oppskrifter/tradisjon/tyttebarromme/"},{t:"Tytteb&#230;r &ndash; viltgodt.no",u:"https://www.viltgodt.no/tyttebaer-2/"}]},

  {n:"Bringeb&#230;r",la:"Rubus idaeus",t:"s",cat:"baer",desc:"Et av Norges mest elskede b&#230;r. R&#248;d, s&#248;t og aromatisk.",nsnf:"https://soppognyttevekster.no/nyttevekst/bringebaer-12/",rec:[{t:"Bringeb&#230;rsyltet&#248;y",u:"https://www.matprat.no/oppskrifter/tradisjon/bringebaersyltetoy/"},{t:"Bringeb&#230;rkake",u:"https://www.matprat.no/oppskrifter/bakverk/bringebaerkake/"}]},

  {n:"Markjordb&#230;r",la:"Fragaria vesca",t:"s",cat:"baer",desc:"Vill jordb&#230;r med intens, s&#248;t smak. Spis fra planten eller lag syltet&#248;y.",nsnf:"https://soppognyttevekster.no/nyttevekst/markjordbaer-7/",rec:[{t:"Jordb&#230;rsyltet&#248;y",u:"https://www.matprat.no/oppskrifter/tradisjon/jordbarsyltetoy/"}]},

  {n:"Blokkeb&#230;r",la:"Vaccinium uliginosum",t:"s",cat:"baer",desc:"Bl&#229;svarte b&#230;r fra myr og fjell. Mildere smak enn bl&#229;b&#230;r.",nsnf:"https://soppognyttevekster.no/nyttevekst/blokkebaer/",rec:[]},
  {n:"Traneb&#230;r",la:"Vaccinium oxycoccos",t:"s",cat:"fjell",desc:"R&#248;de b&#230;r fra myr. Syrlige og aromatiske &ndash; til saus, gel&#233; og juice.",nsnf:"https://soppognyttevekster.no/nyttevekst/tranebaer/",rec:[{t:"Traneb&#230;rsaus",u:"https://www.matprat.no/oppskrifter/tradisjon/tranebarsaus/"}]},
  {n:"Svartsurb&#230;r",la:"Aronia melanocarpa",t:"s",cat:"baer",desc:"Svarte b&#230;r rike p&#229; antioksidanter. Til syltet&#248;y, juice og helseprodukter.",nsnf:"https://soppognyttevekster.no/nyttevekst/svartsurbaer/",rec:[{t:"Aroniamarmelade &ndash; godt.no",u:"https://www.godt.no/oppskrift/aroniamarmelade/"}]},
  {n:"Teieb&#230;r",la:"Rubus saxatilis",t:"s",cat:"baer",desc:"R&#248;de b&#230;r i skog og fjell. Syrlige og saftige &ndash; gode til syltet&#248;y.",nsnf:"https://soppognyttevekster.no/nyttevekst/teiebaer-3/",rec:[]},

  {n:"Ramsl&#248;k",la:"Allium ursinum",t:"s",cat:"urter",desc:"Vill hvitl&#248;k med breie blader. Sterk hvitl&#248;kssmak. Til pesto, sm&#248;r, suppe og pasta.",nsnf:"https://soppognyttevekster.no/nyttevekst/ramslok/",rec:[{t:"Ramsl&#248;kpesto",u:"https://www.matprat.no/oppskrifter/kos/ramslokpesto/"},{t:"Ramsl&#248;ksm&#248;r",u:"https://www.matprat.no/oppskrifter/gjester/ramsloksmor/"},{t:"Kyllingsuppe m/ramsl&#248;k",u:"https://www.matprat.no/oppskrifter/gjester/kremet-kyllingsuppe-med-ramslok/"}]},
  {n:"Stornesle",la:"Urtica dioica",t:"s",cat:"urter",desc:"Brennes, men koking n&#248;ytraliserer brodden. Unge skudd smaker som spinat.",nsnf:"https://soppognyttevekster.no/nyttevekst/stornesle-10/",rec:[{t:"Neslesuppe",u:"https://www.matprat.no/oppskrifter/middag/neslesuppe/"},{t:"Neslepesto",u:"https://www.matprat.no/oppskrifter/tilbehor/nesleopesto/"},{t:"Nesle &ndash; viltgodt.no",u:"https://www.viltgodt.no/nesle/"}]},
  {n:"Skvallerk&#229;l",la:"Aegopodium podagraria",t:"s",cat:"urter",desc:"Beryktet hageugras, men utmerket mat! Smaker som blanding av persille og selleri.",nsnf:"https://soppognyttevekster.no/nyttevekst/skvallerkal-9/",rec:[{t:"Skvallerk&#229;l &ndash; viltgodt.no",u:"https://www.viltgodt.no/skvallerkaal/"},{t:"Villurtpesto",u:"https://www.matprat.no/oppskrifter/tilbehor/villurtpesto/"}]},

// ─── iNaturalist images ──────────────────────────────────────────────────────
const ICACHE = {};
function loadImg(latin) {
  if (latin in ICACHE) return;
  ICACHE[latin] = "loading";
  fetch("https://api.inaturalist.org/v1/taxa?q=" + encodeURIComponent(latin) + "&rank=species,genus&per_page=1")
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if (!d) return;
      const tx = d.results && d.results[0];
      const url = tx && tx.default_photo && tx.default_photo.medium_url;
      ICACHE[latin] = url || null;
      if (!url) return;
      document.querySelectorAll(".inat-wrap[data-la]").forEach(el => {
        if (el.dataset.la !== latin) return;
        const img = el.querySelector(".inat-img");
        const ph  = el.querySelector(".inat-ph");
        const src = el.querySelector(".inat-src");
        if (img) { img.src = url; img.style.display = "block"; }
        if (ph)  { ph.style.display = "none"; }
        if (src) { src.style.display = "block"; }
      });
    })
    .catch(() => { ICACHE[latin] = null; });
}

function makeImgWrap(latin, wrapClass) {
  setTimeout(() => loadImg(latin), 10);
  return `<div class="inat-wrap ${wrapClass}" data-la="${latin.replace(/"/g,"&quot;")}">
    <span class="inat-ph">&#127807;</span>
    <img class="inat-img" src="" alt="" style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
    <span class="inat-src" style="display:none;position:absolute;bottom:3px;left:3px;background:rgba(0,0,0,.5);color:#fff;font-size:.56rem;padding:1px 4px;border-radius:3px;z-index:2">&#128247; iNaturalist (CC)</span>
  </div>`;
}

// ─── State ───────────────────────────────────────────────────────────────────
let FILT = "alle", CATF = "alle", VIEW = "g", SEL = null;

// ─── Filter buttons (rendered in JS to avoid quote escaping) ─────────────────
function buildFilterBtns() {
  const fb = document.getElementById("fbtns");
  const btns = [
    {id:"fb-alle", f:"alle", label:"Alle", cls:"on"},
    {id:"fb-s",    f:"s",    label:"Spiselig", cls:""},
    {id:"fb-m",    f:"m",    label:"Med merknad", cls:"", style:"border-color:rgba(184,112,31,.25)"},
  ];
  fb.innerHTML = "";
  btns.forEach(b => {
    const el = document.createElement("button");
    el.className = "fb" + (b.cls ? " " + b.cls : "");
    el.textContent = b.label;
    if (b.style) el.style.cssText = b.style;
    el.addEventListener("click", () => setF(b.f));
    fb.appendChild(el);
  });
}

function buildCatTabs() {
  const counts = {};
  DATA.forEach(p => { counts[p.cat] = (counts[p.cat]||0) + 1; });
  const ct = document.getElementById("cattabs");
  ct.innerHTML = "";
  const allBtn = document.createElement("button");
  allBtn.className = "catbtn on";
  allBtn.innerHTML = "&#127807; Alle kategorier";
  allBtn.addEventListener("click", () => setCat("alle", allBtn));
  ct.appendChild(allBtn);
  Object.entries(CATS).forEach(([k, v]) => {
    if (!counts[k]) return;
    const btn = document.createElement("button");
    btn.className = "catbtn";
    btn.innerHTML = v.e + " " + v.l;
    btn.addEventListener("click", () => setCat(k, btn));
    ct.appendChild(btn);
  });
}

function setF(f) {
  FILT = f;
  document.querySelectorAll(".fb").forEach(b => b.classList.remove("on","onm"));
  const map = {alle:"fb-alle", s:"fb-s", m:"fb-m"};
  const el = document.getElementById(map[f]);
  if (el) el.classList.add(f === "m" ? "onm" : "on");
  render();
}

function setCat(c, btn) {
  CATF = c;
  document.querySelectorAll(".catbtn").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
  render();
}

function setV(v) {
  VIEW = v;
  document.getElementById("vbg").classList.toggle("on", v === "g");
  document.getElementById("vbt").classList.toggle("on", v === "t");
  render();
}

function getList() {
  const q = document.getElementById("search").value.toLowerCase();
  const srt = document.getElementById("srt").value;
  let list = DATA.filter(p => {
    if (FILT === "s" && p.t !== "s") return false;
    if (FILT === "m" && p.t !== "m") return false;
    if (CATF !== "alle" && p.cat !== CATF) return false;
    if (q && !p.n.toLowerCase().includes(q) && !p.la.toLowerCase().includes(q)) return false;
    return true;
  });
  list.sort((a, b) => {
    if (srt === "cat") {
      const ck = Object.keys(CATS);
      const ci = x => ck.indexOf(x.cat);
      return ci(a) !== ci(b) ? ci(a) - ci(b) : a.n.localeCompare(b.n, "nb");
    }
    if (srt === "az") return a.n.localeCompare(b.n, "nb");
    if (srt === "za") return b.n.localeCompare(a.n, "nb");
    return a.la.localeCompare(b.la);
  });
  return list;
}

function bdg(t, large) {
  const s = t === "s"
    ? {bg:"#e1f5ee", c:"#0a6045", l:"Spiselig"}
    : {bg:"#fdf3e3", c:"#8a5200", l:"Med merknad"};
  return `<span class="${large ? "dbadge" : "tbdg"}" style="background:${s.bg};color:${s.c}">${s.l}</span>`;
}

function openDetail(idx) {
  const p = DATA[idx];
  SEL = p.n;
  const cat = CATS[p.cat];
  const catBdg = cat ? `<div class="dcat">${cat.e} ${cat.l}</div>` : "";
  const recH = p.rec && p.rec.length
    ? p.rec.map(r => `<a class="rl" href="${r.u}" target="_blank" rel="noopener">&#128214; ${r.t}</a>`).join("")
    : `<span class="nor">Ingen oppskrifter. <a href="https://www.matprat.no/s/?q=${encodeURIComponent(p.n)}" target="_blank" rel="noopener">S&#248;k p&#229; matprat.no &#8594;</a></span>`;

  const det = document.getElementById("det");
  det.style.display = "block";
  det.innerHTML = `
    <div class="dettop">
      ${makeImgWrap(p.la, "diw")}
      <div class="dinfo">
        ${bdg(p.t, true)}${catBdg}
        <div class="dname">${p.n}</div>
        <div class="dlatin">${p.la}</div>
        <p class="ddesc">${p.desc}</p>
        <div class="dact">
          <a class="btn bg" href="${p.nsnf}" target="_blank" rel="noopener">Les mer p&#229; NSNF &#8599;</a>
          <a class="btn bm" href="https://www.inaturalist.org/taxa/search?q=${encodeURIComponent(p.la)}" target="_blank" rel="noopener">iNaturalist &#8599;</a>
          <a class="btn bm" style="background:#2d5a3d" href="https://no.wikipedia.org/wiki/${encodeURIComponent(p.la.replace(/ /g,"_"))}" target="_blank" rel="noopener">Wikipedia &#8599;</a>
          <button class="btn bo" onclick="closeDetail()">Lukk &#10005;</button>
        </div>
      </div>
    </div>
    <div class="detbot"><h3>Oppskrifter</h3><div class="rlist">${recH}</div></div>`;

  det.scrollIntoView({behavior:"smooth", block:"nearest"});
  document.querySelectorAll(".pi").forEach(el => el.classList.toggle("on", el.dataset.idx === String(idx)));
}

function closeDetail() {
  document.getElementById("det").style.display = "none";
  SEL = null;
  document.querySelectorAll(".pi").forEach(el => el.classList.remove("on"));
}

function render() {
  const list = getList();
  const srt  = document.getElementById("srt").value;

  document.getElementById("cntTxt").textContent = `Viser ${list.length} vekst${list.length !== 1 ? "er" : ""}`;
  document.getElementById("sbCnt").textContent  = `${list.length} vekster`;
  document.getElementById("sTot").textContent   = DATA.length;
  document.getElementById("sSp").textContent    = DATA.filter(p => p.t === "s").length;
  document.getElementById("sMk").textContent    = DATA.filter(p => p.t === "m").length;

  // Sidebar
  document.getElementById("plist").innerHTML = list.map(p => {
    const idx = DATA.indexOf(p);
    return `<li class="pi${SEL === p.n ? " on" : ""}" data-idx="${idx}" onclick="openDetail(${idx})">
      ${makeImgWrap(p.la, "pithumb")}
      <div style="flex:1;min-width:0"><div class="pin">${p.n}</div><div class="pil">${p.la}</div></div>
      <div class="dot d${p.t === "s" ? "s" : "m"}"></div>
    </li>`;
  }).join("");

  // Grid / Table
  if (VIEW === "g") {
    document.getElementById("pgrid").style.display = "grid";
    document.getElementById("ptbl").style.display  = "none";

    let html = "";
    if (srt === "cat" && CATF === "alle") {
      const groups = {};
      list.forEach(p => { (groups[p.cat] = groups[p.cat] || []).push(p); });
      Object.keys(CATS).forEach(ck => {
        if (!groups[ck]) return;
        const cv = CATS[ck];
        html += `<div class="sec-hdr">${cv.e} ${cv.l}<span class="sc">${groups[ck].length} vekster</span></div>`;
        groups[ck].forEach(p => { html += cardHtml(p); });
      });
    } else {
      list.forEach(p => { html += cardHtml(p); });
    }
    document.getElementById("pgrid").innerHTML = html || "<div style='padding:2rem;color:var(--mu);grid-column:1/-1'>Ingen treff.</div>";

  } else {
    document.getElementById("pgrid").style.display = "none";
    document.getElementById("ptbl").style.display  = "table";
    document.getElementById("tbody").innerHTML = list.map(p => {
      const idx = DATA.indexOf(p);
      const cat = CATS[p.cat];
      return `<tr onclick="openDetail(${idx})">
        <td>${makeImgWrap(p.la, "tt")}</td>
        <td><strong>${p.n}</strong></td>
        <td style="color:var(--mu);font-style:italic;font-size:.78rem">${p.la}</td>
        <td style="font-size:.78rem">${cat ? cat.e + " " + cat.l : "&ndash;"}</td>
        <td>${bdg(p.t, false)}</td>
        <td><a href="${p.nsnf}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--gs);font-size:.77rem">NSNF &#8594;</a></td>
      </tr>`;
    }).join("");
  }
}

function cardHtml(p) {
  const idx = DATA.indexOf(p);
  const cat = CATS[p.cat];
  return `<div class="card" onclick="openDetail(${idx})">
    <div style="position:relative">
      ${makeImgWrap(p.la, "cimg")}
      <span class="cbadge bg${p.t === "s" ? "s" : "m"}">${p.t === "s" ? "Spiselig" : "Merknad"}</span>
    </div>
    <div class="cbody">
      <div class="cn">${p.n}</div>
      <div class="cl">${p.la}</div>
      ${cat ? `<div class="cc">${cat.e} ${cat.l}</div>` : ""}
    </div>
  </div>`;
}

// ─── Init ────────────────────────────────────────────────────────────────────
buildFilterBtns();
buildCatTabs();
render();
</script>
</body>
</html>
